name: Build concourse hooks

# Builds the two concourse hook DLLs on a Windows runner so the XWAU-on-Linux
# effort can iterate on patches without a per-change round trip to the upstream
# author. Native hook_concourse.dll = MSVC/MSBuild; hook_concourse_net.dll =
# .NET 9 NativeAOT (win-x86), built via VS MSBuild because the csproj uses a
# CodeTaskFactory inline task that dotnet's Core MSBuild can't run. Artifacts are
# uploaded for download + drop-in test.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: NuGet restore (packages.config SourceLink for the native vcxproj)
        run: nuget restore xwa_hook_concourse\xwa_hook_concourse.sln

      - name: Build native hook_concourse (MSVC, solution platform x86)
        run: msbuild xwa_hook_concourse\xwa_hook_concourse.sln /t:hook_concourse /p:Configuration=Release /p:Platform=x86 /m

      - name: Build hook_concourse_net (NativeAOT win-x86, via VS MSBuild)
        run: msbuild xwa_hook_concourse\hook_concourse_net\hook_concourse_net\hook_concourse_net.csproj /restore /p:Configuration=Release /m
        continue-on-error: true

      - name: Build hook_32bpp_net (NativeAOT win-x86, via VS MSBuild)
        run: msbuild xwa_hook_32bpp\hook_32bpp_net\hook_32bpp_net\hook_32bpp_net.csproj /restore /p:Configuration=Release /m
        continue-on-error: true

      - name: Collect built DLLs (exclude committed zip/ and intermediates)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # NativeAOT output lives under ...\publish\ (or native\); the IL stub of the same name lives in
          # bin\Release\net9.0\win-x86\. Copy everything, publish/native copies LAST so they win.
          $all = Get-ChildItem -Recurse -Include 'hook_concourse*.dll','hook_32bpp*.dll' |
            Where-Object { $_.FullName -notmatch '\\(obj|zip|out)\\' }
          $all | Sort-Object { $_.FullName -match '\\(publish|native)\\' } |
            ForEach-Object {
              Write-Host "found: $($_.FullName)  ($($_.Length) bytes)"
              Copy-Item $_.FullName -Destination "out\$($_.Name)" -Force
            }
          # The csproj publishes NativeAOT as part of Build; the native DLLs land in ...\win-x86\publish\.
          # Copy those explicitly, last, so they overwrite the same-named IL stubs from ...\win-x86\.
          foreach ($pub in @(
              'xwa_hook_concourse\hook_concourse_net\hook_concourse_net\bin\Release\net9.0\win-x86\publish\hook_concourse_net.dll',
              'xwa_hook_32bpp\hook_32bpp_net\hook_32bpp_net\bin\Release\net9.0\win-x86\publish\hook_32bpp_net.dll')) {
            if (Test-Path $pub) { Write-Host "native: $pub ($((Get-Item $pub).Length) bytes)"; Copy-Item $pub -Destination out\ -Force }
            else { Write-Host "MISSING native output: $pub" }
          }
          Write-Host "---- collected (out) ----"
          Get-ChildItem out -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concourse-dlls
          path: out/**
          if-no-files-found: warn
